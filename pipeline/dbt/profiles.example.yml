# dbt profile for the PROX-VOICE pipeline. Copy to ~/.dbt/profiles.yml, or run
# dbt with --profiles-dir pointing at a directory holding a profiles.yml built
# from this template.
#
# dev  — local dbt-spark session method: models run in an in-process SparkSession
#        with Delta configured, reading the silver tables the Spark jobs register
#        in the local metastore. Requires a Spark-compatible JDK (8/11/17) on
#        JAVA_HOME.
# prod — Databricks/Synapse: switch method to `thrift` or `odbc` and point host
#        at the cluster; the models are unchanged.
prox_voice:
  target: dev
  outputs:
    dev:
      type: spark
      method: session
      schema: gold
      host: localhost
      server_side_parameters:
        spark.jars.packages: io.delta:delta-spark_2.12:3.2.0
        spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
        spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
